[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reddex"
version = "0.1.0a1"
description = "Archive and full-text search Reddit Chat messages from an authorized browser session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.8,<2",
]

[project.scripts]
reddex = "reddex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
